<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagas de Estágio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Vagas de Estágio</h1>
            <p>Cadastre e encontre oportunidades de estágio.</p>
        </header>

        <form id="formVaga">

            <input type="text" id="empresa" placeholder="Nome da empresa" required>

            <input type="text" id="vaga" placeholder="Nome da vaga" required>

            <input type="text" id="area" placeholder="Área de atuação" required>

            <input type="text" id="local" placeholder="Localização" required>

            <input type="email" id="email" placeholder="E-mail para contato" required>

            <textarea id="descricao" placeholder="Descrição da vaga" required></textarea>

            <button type="submit">Cadastrar vaga</button>

        </form>

        <h2>Vagas disponíveis</h2>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Vaga</th>
                        <th>Área</th>
                        <th>Local</th>
                        <th>Contato</th>
                    </tr>
                </thead>

                <tbody id="listaVagas">
                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
